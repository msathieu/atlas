[package]
name = "shared-server"
version.workspace = true
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
argon2 = {version = "0.5.3", features = ["std"]}
aws-lc-rs = "1.17.1"
base64 = "0.23.0"
diesel = {version = "2.2.12", features = ["uuid"]}
diesel-async = {version = "0.9.2", features = ["postgres", "deadpool"]}
jsonwebtoken = {version = "11.0.0", features = ["aws_lc_rs"]}
object = "0.40.0"
rand = "0.10.2"
redis = {version = "1.2.1", features = ["connection-manager", "tokio-comp"]}
tokio = {version = "1.48.0", features = ["fs"]}
uuid = {version = "1.18.1", features = ["serde"]}
serde = {version = "1.0.228", features = ["derive"]}
rustls = "0.23.43"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
futures-util = "0.3.34"
