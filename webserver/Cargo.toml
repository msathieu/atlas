[package]
name = "webserver"
version.workspace = true
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
argon2 = {version = "0.5.3", features = ["std"]}
axum = {version = "0.8.6", features = ["http2", "macros", "ws"]}
diesel = {version = "2.2.12", features = ["uuid"]}
diesel-async = {version = "0.9.2", features = ["postgres", "deadpool"]}
dotenvy = "0.15.7"
tokio = {version = "1.47.1", features = ["rt-multi-thread"]}
serde = {version = "1.0.228", features = ["derive"]}
shared-api = {path = "../shared-api"}
shared-server = {path = "../shared-server"}
uuid = {version = "1.18.1", features = ["serde"]}
jsonwebtoken = {version = "11.0.0", features = ["aws_lc_rs"]}
base64 = "0.23.0"
axum-extra = {version = "0.12.0", features = ["typed-header"]}
tower-http = {version = "0.7.0", features = ["cors", "fs"]}
gethostname = "1.0.2"
aws-lc-rs = "1.16.3"
serde_json = "1.0.149"
sha2 = "0.11.0"
redis = {version = "1.2.1", features = ["connection-manager", "tokio-comp"]}
hex = "0.4.3"
webauthn-rs = {version = "0.5.5", features = ["danger-allow-state-serialisation"]}
webauthn-rs-core = "0.5.5"
ssh-key = {version = "0.6.7", features = ["ed25519"]}
rand = "0.10.2"
