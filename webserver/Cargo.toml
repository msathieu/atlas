[package]
name = "webserver"
version = "0.0.1"
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
argon2 = {version = "0.5.3", features = ["std"]}
axum = {version = "0.8.6", features = ["http2", "macros", "ws"]}
diesel = {version = "2.2.12", features = ["postgres", "uuid"]}
dotenvy = "0.15.7"
tokio = {version = "1.47.1", features = ["rt-multi-thread"]}
serde = {version = "1.0.228", features = ["derive"]}
shared-api = {path = "../shared-api"}
shared-server = {path = "../shared-server"}
uuid = {version = "1.18.1", features = ["serde"]}
jsonwebtoken = {version = "10.0.0", features = ["aws_lc_rs"]}
base64 = "0.22.1"
axum-extra = {version = "0.12.0", features = ["typed-header"]}
tower-http = {version = "0.6.6", features = ["cors", "fs"]}
gethostname = "1.0.2"
fred = "10.1.0"
aws-lc-rs = "1.16.3"
serde_json = "1.0.149"
sha2 = "0.11.0"
