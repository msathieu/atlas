apiVersion: v1
kind: Namespace
metadata:
  name: atlas
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-master
  namespace: atlas
rules:
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - pods
      - pods/exec
      - services
    verbs:
      - get
      - watch
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-master
  namespace: atlas
subjects:
  - kind: ServiceAccount
    name: atlas-master
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlas-master
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
  namespace: atlas
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.namespace }}
      podSelector:
        matchLabels:
          app: atlas-proxy
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.namespace }}
      podSelector:
        matchLabels:
          app: atlas-web
