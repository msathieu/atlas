apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-web
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: atlas-web
  template:
    metadata:
      name: atlas-web
      labels:
        app: atlas-web
    spec:
      hostUsers: false
      containers:
        - name: atlas-web
          image: {{ .Values.image }}
          command: ['/webserver']
          env:
            - name: APISERVER_HOST
              value: {{ .Values.apiserverHost }}
            - name: WEBSERVER_HOST
              value: {{ .Values.webserverHost }}
            - name: VALKEY_HOST
              value: atlas-valkey
            - name: DATABASE_HOST
              value: atlas-db-rw
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-db-app
                  key: password
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-valkey-password
                  key: password
            - name: DATABASE_CERT
              valueFrom:
                secretKeyRef:
                  name: atlas-db-ca
                  key: ca.crt
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-web
spec:
  selector:
    app: atlas-web
  ports:
    - port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-web
spec:
  parentRefs:
    - name: {{ .Values.envoyName }}
  hostnames:
    - {{ .Values.webserverHost }}
  rules:
    - backendRefs:
        - name: atlas-web
          port: 8000
      sessionPersistence:
        type: Cookie
      timeouts:
        request: 600s
