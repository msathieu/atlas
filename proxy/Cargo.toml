[package]
name = "proxy"
version.workspace = true
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
async-trait = "0.1.89"
bytes = "1.12.1"
diesel = {version = "2.2.12", features = ["uuid"]}
diesel-async = {version = "0.9.2", features = ["postgres", "deadpool"]}
dotenvy = "0.15.7"
pingora = {version = "0.9.0", features = ["proxy"]}
shared-api = {path = "../shared-api"}
shared-server = {path = "../shared-server"}
uuid = "1.23.4"
redis = "1.2.1"
tokio = {version = "1.53.1", features = ["net"]}
serde_json = "1.0.151"
http = "1.5.0"
rustls = "0.23.43"
