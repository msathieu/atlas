[package]
name = "master"
version.workspace = true
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
aws-lc-rs = "1.16.3"
base64 = "0.22.1"
diesel = {version = "2.2.12", features = ["postgres", "uuid"]}
diesel_migrations = "2.2.0"
dotenvy = "0.15.7"
lettre = {version = "0.11.19", features = ["tokio1", "tokio1-native-tls"]}
rand = "0.10.0"
rcgen = {version = "0.14.3", features = ["aws_lc_rs"]}
rig-core = "0.39.0"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.145"
shared-api = {path = "../shared-api"}
shared-server = {path = "../shared-server"}
time = "0.3.44"
tokio = {version = "1.47.1", features = ["macros", "rt-multi-thread", "time"]}
unicode-rs = "0.1.0"
uuid = "1.18.1"
webauthn-rs = "0.5.5"
