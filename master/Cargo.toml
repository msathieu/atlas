[package]
name = "master"
version.workspace = true
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
aws-lc-rs = "1.16.3"
base64 = "0.23.0"
diesel = {version = "2.2.12", features = ["uuid"]}
diesel-async = {version = "0.9.2", features = ["async-connection-wrapper", "postgres", "deadpool"]}
diesel_migrations = "2.2.0"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
k8s-openapi = {version = "0.28.0", features = ["v1_36"]}
kube = {version = "4.0.0", features = ["ws"]}
lettre = {version = "0.11.19", features = ["tokio1", "tokio1-native-tls"]}
rand = "0.10.0"
rcgen = {version = "0.14.3", features = ["aws_lc_rs"]}
redis = "1.3.0"
reqwest = "0.13.4"
rig-agent = "0.42.0"
rig-core = "0.42.0"
rustls = "0.23.41"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.145"
sha2 = "0.11.0"
shared-api = {path = "../shared-api"}
shared-server = {path = "../shared-server"}
time = "0.3.44"
tokio = {version = "1.47.1", features = ["macros", "rt-multi-thread", "time"]}
unicode-rs = "0.1.0"
uuid = "1.18.1"
webauthn-rs = "0.5.5"
