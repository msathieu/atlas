name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: debian-13
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y sudo
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            filter-syscalls = false
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: nix develop -c cargo build
      - name: Run cargo-deny
        run: nix develop -c cargo deny check
      - name: Run clippy
        run: nix develop -c cargo clippy -- -Dwarnings
      - name: Run cargo fmt
        run: nix develop -c -- cargo fmt --check
      - name: Install frontend dependencies
        run: cd frontend && nix develop -c npm ci
      - name: Build frontend
        run: cd frontend && nix develop -c npm run build
      - name: Run svelte-check
        run: cd frontend && nix develop -c npm run check
      - name: Run Biome lint
        run: cd frontend && nix develop -c npm run lint
